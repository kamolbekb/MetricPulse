services:
  db:
    image: postgres:16-alpine
    container_name: metricpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metricpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metricpulse_secret}
      POSTGRES_DB: ${POSTGRES_DB:-metricpulse}
    ports:
      - "5432:5432"
    volumes:
      - metricpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metricpulse} -d ${POSTGRES_DB:-metricpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metricpulse-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-metricpulse}:${POSTGRES_PASSWORD:-metricpulse_secret}@db:5432/${POSTGRES_DB:-metricpulse}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-metricpulse-secret-key}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: metricpulse-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  metricpulse_pgdata:
